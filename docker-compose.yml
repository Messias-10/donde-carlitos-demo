# Donde Carlitos Emporio — demo local (web Next.js + API Go + SQLite).
#
#   docker compose up -d --build        levantar (si el 3000 está ocupado: WEB_PORT=3100 docker compose up -d --build)
#   docker compose down                 detener (conserva base e imágenes subidas)
#   docker compose down -v              detener y BORRAR base e imágenes (vuelve la semilla)
#
# Clave del panel (una vez, antes de entrar al admin; escribe api/.env y api/ADMIN_PASSWORD.local.txt):
#   docker compose run --rm --no-deps -v "./api:/work" --entrypoint /app/setup-admin api -dir /work
#   docker compose up -d api            (reinicia la API para que lea el .env)
#
# La API NO se publica en la máquina: el navegador entra solo por la web (127.0.0.1:${WEB_PORT}).
# Para depurar la API directo en 127.0.0.1:8080:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# Sin secretos aquí: los secretos viven en api/.env (ignorado por git).
name: donde-carlitos

services:
  api:
    build:
      context: ./api
    image: donde-carlitos-api:local
    restart: unless-stopped
    env_file:
      # Secretos: ADMIN_USUARIO, ADMIN_PASSWORD_HASH_B64 (bcrypt en base64, sin "$"), SESSION_SECRET.
      # DATOS_TRANSFERENCIA (opcional, lo escribe el dueño; solo panel) también va en api/.env, nunca aquí.
      # Opcional: sin este archivo la tienda funciona y el panel responde "admin_no_configurado".
      - path: api/.env
        required: false
    environment:
      APP_ENV: development
      DB_PATH: /data/carlitos.db
      IMAGENES_DIR: /imagenes
      # Debe calzar con el puerto publicado de web (WEB_PORT, por defecto 3000).
      ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000},http://127.0.0.1:${WEB_PORT:-3000}
      # Vacío a propósito: Next.js reenvía el X-Forwarded-For que manda el cliente (no lo sobrescribe),
      # así que en este demo la API NO lo cree y limita por la IP de la conexión (el contenedor web).
      # Consecuencia en local: los límites por IP (bloqueo de login, seguimiento) son compartidos por todo el demo;
      # el bloqueo de login se limpia reiniciando la API (docker compose restart api).
      # Producción: un proxy de borde que SOBRESCRIBA X-Forwarded-For delante de web, y aquí 172.30.57.10/32.
      TRUSTED_PROXIES: ""
      # WhatsApp del negocio (datos públicos). Regiones vacío = [CONFIRMAR]: la landing usa el de Santiago.
      WHATSAPP_SANTIAGO: ${WHATSAPP_SANTIAGO:-56921145368}
      WHATSAPP_REGIONES: ${WHATSAPP_REGIONES:-}
      # Base del link de seguimiento que se manda al cliente.
      URL_SITIO: http://localhost:${WEB_PORT:-3000}
      DIRECCION_RETIRO: Alameda 2432, Santiago Centro
      SEED_DEMO: "true"
      SEED_PEDIDOS_DEMO: "true"
    volumes:
      - datos-api:/data
      - imagenes-api:/imagenes
    networks:
      interna:
        ipv4_address: 172.30.57.20
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 15s
      timeout: 4s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./web
      args:
        # next.config lee estas variables al hacer el build (rewrites /api/* -> API).
        API_INTERNAL_URL: http://api:8080
        NEXT_PUBLIC_WHATSAPP_SANTIAGO: ${WHATSAPP_SANTIAGO:-56921145368}
        NEXT_PUBLIC_WHATSAPP_REGIONES: ${WHATSAPP_REGIONES:-}
        NEXT_PUBLIC_WHATSAPP_PEDIDOS: ${WHATSAPP_SANTIAGO:-56921145368}
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    image: donde-carlitos-web:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_WHATSAPP_SANTIAGO: ${WHATSAPP_SANTIAGO:-56921145368}
      NEXT_PUBLIC_WHATSAPP_REGIONES: ${WHATSAPP_REGIONES:-}
      NEXT_PUBLIC_WHATSAPP_PEDIDOS: ${WHATSAPP_SANTIAGO:-56921145368}
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      interna:
        # IP fija: es el único proxy en que confía la API (TRUSTED_PROXIES).
        ipv4_address: 172.30.57.10
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
      # Caché de next/image; dueño = usuario node (uid 1000) de la imagen.
      - /app/.next/cache:size=128m,uid=1000,gid=1000,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  interna:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.57.0/24

volumes:
  datos-api:
  imagenes-api:
