openapi: 3.1.0
info:
  title: API Donde Carlitos Emporio (demo)
  version: 2.0.0
  description: |
    Contrato entre la API en Go (`api/`) y el front Next.js (`web/`). Lo mantiene ingeniero-go;
    si cambia, se avisa al orquestador.

    **v2 (2026-11-14, cambio de enfoque):** no hay carrito ni pedido público. El sitio es una landing
    pública (vitrina, botones de WhatsApp Santiago/Regiones, seguimiento) más un **panel de gestión de pedidos**
    donde el equipo registra los pedidos que llegan por WhatsApp. Se eliminó `POST /api/pedidos`.

    **Convenciones**
    - Todo es JSON UTF-8 (salvo el CSV y las imágenes). Montos en **pesos chilenos enteros**.
    - Fechas-hora **siempre en UTC** (RFC 3339, `2026-11-14T15:00:00Z`). Fechas simples `AAAA-MM-DD` = día de Chile
      (`America/Santiago`); los filtros `desde`/`hasta` también son días de Chile.
    - El front llama por el **mismo origen** (`/api/*` con rewrites de Next.js hacia `http://api:8080`). No hay CORS.
    - **POST/PUT/PATCH/DELETE exigen el header `Origin`** con un origen permitido (`ALLOWED_ORIGINS`). Si falta o
      no coincide → `403 origen_no_permitido`. Con curl: `-H "Origin: http://localhost:3100"`.
    - Cuerpos JSON con `Content-Type: application/json` (si no → `415`), sin campos desconocidos (→ `400 json_invalido`)
      y bajo el tamaño máximo (→ `413 cuerpo_muy_grande`).
    - Errores sin detalles internos: `{"error": {"codigo", "mensaje", "campos"?, "detalles"?}}`.
    - Todas las respuestas llevan `Cache-Control: no-store` (salvo imágenes) y cabeceras de seguridad.
    - **Sesión del panel:** cookie `dc_sesion` (en producción `__Host-dc_sesion`), HttpOnly, SameSite=Strict, Path=/.
      El front no maneja tokens.
    - **Roles:** `admin` (todo) y `vendedor` (pedidos y clientes; ve productos pero no los edita; no ve usuarios,
      resumen ni CSV). Una ruta de admin con rol insuficiente → `403 sin_permiso`.
servers:
  - url: /
    description: Mismo origen que el front (rewrite de Next.js)

tags:
  - name: publico
  - name: panel
    description: Requiere sesión (admin o vendedor)
  - name: admin
    description: Requiere sesión con rol admin
  - name: sistema

paths:
  /healthz:
    get:
      tags: [sistema]
      summary: Salud del servicio (verifica la base de datos)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, const: ok }
        "503": { $ref: "#/components/responses/Error" }

  /api/categorias:
    get:
      tags: [publico]
      summary: Categorías con su número de productos visibles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Categoria" }

  /api/productos:
    get:
      tags: [publico]
      summary: Catálogo público con filtros y paginación
      description: |
        Solo productos activos. Los agotados **se muestran** (con `disponibilidad: agotado`) y en el orden
        `relevancia` van al final. Nunca expone el stock numérico.
      parameters:
        - { $ref: "#/components/parameters/Categoria" }
        - { $ref: "#/components/parameters/Busqueda" }
        - { $ref: "#/components/parameters/Oferta" }
        - { $ref: "#/components/parameters/Temporada" }
        - { $ref: "#/components/parameters/RecienLlegado" }
        - { $ref: "#/components/parameters/Orden" }
        - { $ref: "#/components/parameters/Page" }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ProductoPublico" }
        "400": { $ref: "#/components/responses/Validacion" }

  /api/productos/{slug}:
    get:
      tags: [publico]
      summary: Ficha de un producto activo
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", maxLength: 80 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoPublico" }
        "404": { $ref: "#/components/responses/Error" }

  /api/opciones-entrega:
    get:
      tags: [publico]
      summary: Listas para el panel (regiones, agencias) y dirección de retiro
      description: |
        Fuente única para los selectores del registro de pedidos: el front no debe tener su propia lista.
        `agencias_es_ejemplo: true` significa que la lista de agencias es `[EJEMPLO]` hasta que la confirme el dueño.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [retiro, regiones, agencias, agencias_es_ejemplo]
                properties:
                  retiro:
                    type: object
                    properties:
                      direccion: { type: string, examples: ["Alameda 2432, Santiago Centro"] }
                  regiones:
                    type: array
                    items: { $ref: "#/components/schemas/Opcion" }
                  agencias:
                    type: array
                    items: { $ref: "#/components/schemas/Opcion" }
                  agencias_es_ejemplo: { type: boolean }

  /api/config-publica:
    get:
      tags: [publico]
      summary: Datos públicos para la landing (números de WhatsApp, dirección, horario)
      description: |
        Solo datos públicos. `whatsapp_regiones` es null mientras no se confirme (`WHATSAPP_REGIONES` vacío): la
        landing usa el de Santiago y muestra `[CONFIRMAR]`. El horario viene de `HORARIO` (hay versiones distintas en
        las redes: `horario_confirmado` es false hasta que el dueño lo confirme). `horario` = `HORARIO_RETIRO`,
        `direccion` = `DIRECCION_RETIRO`, `site_url` = `URL_SITIO`. `DATOS_TRANSFERENCIA` **nunca** sale aquí.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPublica" }

  /api/seguimiento/{token}:
    get:
      tags: [publico]
      summary: Seguimiento de un pedido por su link (sin datos personales)
      description: |
        `token` = 16 bytes aleatorios en base64url (22 caracteres). Nunca el `DC-xxxx` (se adivina). Va en el link que se le
        manda al cliente. Respuesta con `X-Robots-Tag: noindex, nofollow` y `Referrer-Policy: no-referrer`.
        Devuelve **solo** número, estado, línea de tiempo, tipo de entrega, agencia y n.º de seguimiento.
        **Nunca** nombre, teléfono, comuna, región, montos, ítems ni notas.
        Token mal formado o inexistente → el mismo `404 no_encontrado`. Límite: 30 consultas por minuto por IP y
        600 por minuto en total (`429`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{22}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Seguimiento" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/admin/login:
    post:
      tags: [panel]
      summary: Iniciar sesión
      description: |
        Clave verificada con bcrypt. Tras **5 intentos fallidos en 15 minutos** desde la misma IP, se bloquea
        **15 minutos** (`429 login_bloqueado`, también con la clave correcta). Además, tope global de
        `LOGIN_GLOBAL_MIN` (30) intentos por minuto y máximo 2 verificaciones bcrypt simultáneas
        (`429 demasiadas_solicitudes` con `Retry-After`). Usuario inexistente y clave
        incorrecta responden igual; un usuario desactivado también recibe `401`. Si el panel no está configurado (falta correr setup-admin) → `503 admin_no_configurado`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usuario, password]
              additionalProperties: false
              properties:
                usuario: { type: string, maxLength: 64, examples: [admin] }
                password: { type: string, maxLength: 72 }
      responses:
        "200":
          description: Sesión creada. Llega la cookie `dc_sesion`.
          headers:
            Set-Cookie:
              schema: { type: string, examples: ["dc_sesion=…; Path=/; Max-Age=43200; HttpOnly; SameSite=Strict"] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Limite" }
        "503": { $ref: "#/components/responses/Error" }

  /api/admin/logout:
    post:
      tags: [panel]
      summary: Cerrar sesión (idempotente)
      description: Borra la sesión si existe y expira la cookie. Responde 204 aunque no haya sesión.
      responses:
        "204": { description: Listo }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/sesion:
    get:
      tags: [panel]
      summary: Sesión actual (para saber si mostrar login o panel)
      security: [{ cookieSesion: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sesion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/admin/hoy:
    get:
      tags: [panel]
      summary: Pantalla "Hoy" — lo que hay que atender
      description: |
        - `esperando_pago_mas_24h`: en `esperando_pago` hace más de 24 h (según `estado_desde`).
        - `pagados_sin_despachar`: en `pagado` o `preparando` (incluye los de retiro que pagan en tienda y ya se preparan).
        - `listos_retiro`: en `listo_retiro`.
        - `creados_hoy`: creados hoy (día de Chile), cualquier estado; contadores por canal.
        Cada lista trae como máximo 50 pedidos (los contadores son el total real), sin historial.
      security: [{ cookieSesion: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hoy" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/admin/pedidos:
    get:
      tags: [panel]
      summary: Buscar pedidos (del más nuevo al más antiguo)
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Canal" }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoPedido" }
        - { $ref: "#/components/parameters/BusquedaPedido" }
        - { $ref: "#/components/parameters/Desde" }
        - { $ref: "#/components/parameters/Hasta" }
        - { $ref: "#/components/parameters/Page" }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de pedidos (con ítems, sin historial)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Pedido" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [panel]
      summary: Registrar un pedido (lo hace el equipo mientras atiende el WhatsApp)
      description: |
        - Número correlativo atómico `DC-0001`, `DC-0002`, … y token de seguimiento aleatorio (128 bits).
        - Ítems del catálogo: el precio por unidad lo pone el servidor (el menor entre detalle, oferta vigente y,
          si la cantidad alcanza `mayor_minimo`, precio por mayor) y queda **congelado**. Producto inexistente o
          inactivo → `400` en `items[i].producto_id`.
        - Ítems libres (lo que no está en el catálogo): `descripcion` y `cantidad`; `precio_unitario` es **opcional**
          (una línea puede ir sin precio).
        - Total: si todas las líneas tienen precio, `total = Σ(cantidad × precio) − descuento + costo_envio`, lo calcula
          el servidor y, si se manda `total`, debe coincidir (si no → `400` en `total`). Si alguna línea va sin precio,
          `total` es **obligatorio** (lo escribe quien atiende) y la respuesta trae `total_manual: true`.
        - Por defecto: `canal = santiago` → `entrega = retiro` y `forma_pago = en_tienda`; `regiones` → `envio` y
          `transferencia`. Con envío, `forma_pago` debe ser `transferencia`.
        - Crear **no descuenta stock** (se descuenta al pagar o al empezar a prepararlo).
        - `registrado_por` = usuario de la sesión. Body máx. 64 KB.
      security: [{ cookieSesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoEntrada" }
            examples:
              regiones:
                value:
                  canal: regiones
                  nombre: Pedro Soto
                  telefono: "+56 9 0000 0101"
                  comuna: Chillán
                  region: nuble
                  agencia: starken
                  envio_por_pagar: true
                  items:
                    - { producto_id: 1, cantidad: 12 }
                    - { producto_id: 10, cantidad: 4 }
                  nota_interna: Pide que vaya bien embalado
                  estado_inicial: esperando_pago
              santiago_con_linea_sin_precio:
                value:
                  canal: santiago
                  nombre: Camila Rojas
                  telefono: "912345678"
                  items:
                    - { producto_id: 17, cantidad: 3 }
                    - { descripcion: "Bolsas de regalo surtidas", cantidad: 1 }
                  total: 20000
      responses:
        "201":
          description: Pedido creado (con historial)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/pedidos.csv:
    get:
      tags: [admin]
      summary: Exportar pedidos a CSV (mismos filtros que la búsqueda)
      description: |
        UTF-8 con BOM, separador `;` (abre bien en Excel en español), una fila por pedido, máximo 10.000 filas.
        Columnas: numero; creado_en_utc; canal; estado; cliente; telefono; entrega; region; comuna; agencia;
        n_seguimiento; forma_pago; subtotal; descuento; costo_envio; total; pago_medio; pago_monto; pago_fecha;
        registrado_por; es_demo.
        **Protección contra CSV injection:** toda celda de texto que empiece con `=`, `+`, `-`, `@`, tabulación o
        retorno de carro se antepone con `'`.
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Canal" }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoPedido" }
        - { $ref: "#/components/parameters/BusquedaPedido" }
        - { $ref: "#/components/parameters/Desde" }
        - { $ref: "#/components/parameters/Hasta" }
      responses:
        "200":
          description: 'Archivo CSV (Content-Disposition: attachment; filename="pedidos.csv")'
          content:
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/pedidos/{id}:
    get:
      tags: [panel]
      summary: Detalle del pedido con historial
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [panel]
      summary: Editar un pedido (solo en cotizado o esperando_pago)
      description: |
        Reemplaza canal, cliente, entrega, forma de pago, ítems, descuento, envío, total y nota (mismo cuerpo que el POST;
        `estado_inicial` se ignora).
        Los precios de catálogo se recalculan y se vuelven a congelar. Si el pedido ya está pagado o más adelante →
        `409 no_editable` (el stock ya se descontó).
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoEntrada" }
      responses:
        "200":
          description: Pedido actualizado (con historial)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/pedidos/{id}/estado:
    patch:
      tags: [panel]
      summary: Cambiar el estado del pedido
      description: |
        Transiciones válidas (cualquier otra → `409 transicion_invalida`):
        - `cotizado` → `esperando_pago` | `pagado` | `preparando` (solo si `forma_pago = en_tienda`)
        - `esperando_pago` → `pagado` | `preparando` (solo si `forma_pago = en_tienda`)
        - `pagado` → `preparando`
        - `preparando` → `despachado` (solo envío) | `listo_retiro` (solo retiro)
        - `despachado` → `entregado`
        - `listo_retiro` → `entregado`
        - cualquiera no final → `cancelado`. Finales: `entregado`, `cancelado`.

        Requisitos (si faltan → `400 validacion` con `campos`):
        - a `pagado`: `pago` con `medio` y `monto` (`fecha` opcional, por defecto hoy) **y**
          `confirmo_pago_recibido: true` (quien atiende revisó que la plata está en la cuenta, no solo el comprobante).
          `verificado_por` = usuario de la sesión.
        - a `despachado`: agencia, `n_seguimiento` y comuna (las del pedido o las de este cuerpo, que las reemplazan).
        - a `entregado` de un pedido que paga al retirar (sin pago registrado): `pago` (medio y monto).
        - a `cancelado`: `motivo` opcional (sale en el mensaje al cliente).

        **Stock:** se descuenta al pasar a `pagado` o a `preparando`, lo que ocurra primero (si algún producto no
        alcanza → `409 stock_insuficiente` con `detalles` = [{producto_id, motivo}] y el pedido no cambia). Se devuelve
        al cancelar un pedido que ya lo tenía descontado. Las líneas libres no tocan stock.
        Cada cambio queda en el historial con usuario, fecha y nota. El pedido trae `transiciones_permitidas`.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CambioEstadoEntrada" }
            examples:
              pagado:
                value: { estado: pagado, pago: { medio: transferencia, monto: 98000, fecha: "2026-11-14" }, confirmo_pago_recibido: true, nota: Plata revisada en la cuenta }
              despachado:
                value: { estado: despachado, agencia: starken, n_seguimiento: "000123456789", comuna: Chillán }
              cancelado:
                value: { estado: cancelado, motivo: "Se nos agotó el producto." }
      responses:
        "200":
          description: Pedido actualizado (con historial)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/pedidos/{id}/mensajes:
    get:
      tags: [panel]
      summary: Mensajes de WhatsApp listos para mandarle al cliente
      description: |
        Textos EXACTOS de las plantillas (d1)–(d8) de `propuesta/mensajes-whatsapp.md` (en la API:
        `internal/mensajes/plantillas.go`, con tests byte a byte). Se devuelven los que aplican al estado actual:
        | clave | plantilla | se ofrece en |
        |---|---|---|
        | `cotizacion` | d1 | cotizado, esperando_pago |
        | `datos_transferencia` | d2 | cotizado, esperando_pago, con `forma_pago = transferencia` y `DATOS_TRANSFERENCIA` no vacío |
        | `recordatorio_pago` | d7 | esperando_pago (sugerido si lleva más de 24 h) |
        | `pago_recibido` | d3 | pagado, preparando (si hay pago registrado) |
        | `despachado` | d4 | despachado |
        | `listo_retiro` | d5 | listo_retiro |
        | `cancelado` | d6 | cancelado |
        | `abrir_chat` | d8 | siempre (sugerido en entregado) |

        `whatsapp_url` = `https://wa.me/<teléfono sin +>?text=<encodeURIComponent(texto)>`; en pedidos `es_demo`,
        **`https://wa.me/?text=…` sin número**. `DATOS_TRANSFERENCIA` vacío → d1 omite el bloque y d2 no aparece
        (nunca se inventan datos bancarios). Link de seguimiento: `URL_SITIO/seguimiento/<token>`.
        Enviar un mensaje no cambia el estado: el panel ofrece el cambio al lado.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [numero, telefono_cliente, mensajes]
                properties:
                  numero: { type: string }
                  telefono_cliente: { type: string, examples: ["+56900000101"] }
                  mensajes:
                    type: array
                    items: { $ref: "#/components/schemas/MensajeCliente" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/clientes:
    get:
      tags: [panel]
      summary: Historial de un cliente por teléfono
      security: [{ cookieSesion: [] }]
      parameters:
        - name: telefono
          in: query
          required: true
          description: Cualquier formato chileno (`+56 9 1234 5678`, `912345678`…)
          schema: { type: string }
      responses:
        "200":
          description: Cliente (si no tiene pedidos, `pedidos` vacío y `nombre` null)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cliente" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /api/admin/resumen:
    get:
      tags: [admin]
      summary: Resumen de pedidos y montos en un rango de fechas
      description: |
        Por defecto, los últimos 30 días (hoy incluido). Máximo 366 días. Los montos de `totales`, `por_canal` y
        `por_agencia` **no** incluyen pedidos cancelados; `por_estado` muestra todos (con el monto de cada estado).
        `por_agencia` solo cuenta envíos (agencia null = envío sin agencia asignada).
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Desde" }
        - { $ref: "#/components/parameters/Hasta" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Resumen" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }

  /api/admin/usuarios:
    get:
      tags: [admin]
      summary: Usuarios del panel
      security: [{ cookieSesion: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Crear un usuario (vendedor o admin) con clave generada
      description: |
        La API genera una clave aleatoria de 16 caracteres y la devuelve **una sola vez** en `clave_temporal`.
        Solo se guarda su hash bcrypt. El admin se la pasa a la persona por un canal privado.
      security: [{ cookieSesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [usuario, nombre, rol]
              properties:
                usuario: { type: string, pattern: "^[a-z][a-z0-9._-]{2,31}$", examples: [vane] }
                nombre: { type: string, minLength: 2, maxLength: 60, examples: ["Vane (regiones)"] }
                rol: { type: string, enum: [admin, vendedor] }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioConClave" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/usuarios/{id}:
    patch:
      tags: [admin]
      summary: Cambiar nombre, rol o activar/desactivar
      description: |
        Desactivar cierra sus sesiones y le impide entrar. Un admin no puede desactivarse ni quitarse el rol a sí
        mismo (`409 no_permitido_sobre_si_mismo`).
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre: { type: string, minLength: 2, maxLength: 60 }
                rol: { type: string, enum: [admin, vendedor] }
                activo: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/usuarios/{id}/clave:
    post:
      tags: [admin]
      summary: Generar una clave nueva (se muestra una vez)
      description: Cierra las sesiones abiertas de ese usuario.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsuarioConClave" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/productos:
    get:
      tags: [panel]
      summary: Todos los productos (incluye inactivos y stock). admin y vendedor
      security: [{ cookieSesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Categoria" }
        - { $ref: "#/components/parameters/Busqueda" }
        - { $ref: "#/components/parameters/Oferta" }
        - { $ref: "#/components/parameters/Temporada" }
        - { $ref: "#/components/parameters/RecienLlegado" }
        - { $ref: "#/components/parameters/Orden" }
        - { $ref: "#/components/parameters/Page" }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagina"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ProductoAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
    post:
      tags: [admin]
      summary: Crear producto
      security: [{ cookieSesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoEntrada" }
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/productos/{id}/imagen:
    post:
      tags: [admin]
      summary: Subir la imagen de un producto
      description: |
        `multipart/form-data` con **un** archivo en el campo `imagen`. Solo JPG, PNG o WebP (validado por los
        primeros bytes, no por el nombre), máximo **5 MB** y 5000 px por lado. El servidor la **re-codifica**
        (quita EXIF/GPS): PNG queda PNG; JPG y WebP quedan JPG. Se guarda con un nombre generado en un volumen
        Docker y `imagen_url` pasa a `/api/imagenes/<32 hex>.jpg|png`. La imagen subida anterior se borra.
        No cambia `precio_actualizado_en`.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagen]
              properties:
                imagen: { type: string, format: binary }
      responses:
        "200":
          description: Producto con la nueva imagen_url
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoAdmin" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/imagenes/{archivo}:
    get:
      tags: [publico]
      summary: Imagen subida desde el panel
      description: |
        Solo nombres generados por el servidor. Content-Type fijo (image/jpeg o image/png), nosniff,
        CSP "default-src 'none'" y Cache-Control "public, max-age=31536000, immutable" (cada subida tiene nombre nuevo).
      parameters:
        - name: archivo
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{32}[.](jpg|png)$" }
      responses:
        "200":
          description: La imagen
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/productos/{id}:
    get:
      tags: [panel]
      summary: Un producto (incluye inactivos). admin y vendedor
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoAdmin" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Reemplazar producto (precio, oferta, stock, activo, etc.)
      description: |
        Reemplazo completo: un campo opcional que no se envía queda en `null`. El panel debe mandar el
        objeto completo que obtuvo con GET, con los cambios. Para quitar una oferta: `precio_oferta: null`.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductoEntrada" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductoAdmin" }
        "400": { $ref: "#/components/responses/Validacion" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Eliminar producto (borrado lógico)
      description: Desaparece del catálogo y del panel; los pedidos antiguos conservan su línea.
      security: [{ cookieSesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Eliminado }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: dc_sesion
      description: En producción el nombre es `__Host-dc_sesion`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Categoria:
      name: categoria
      in: query
      description: Slug de categoría (`navidad`, `juguetes-y-virales`, …)
      schema: { type: string, maxLength: 80 }
    Busqueda:
      name: q
      in: query
      description: |
        Texto libre, máximo 60 caracteres. Sin tildes ni mayúsculas ("telon" encuentra "Telón").
        Cada palabra debe aparecer (máx. 5 palabras). Busca en nombre, código, descripción y categoría.
        Los comodines `%` y `_` se tratan como texto.
      schema: { type: string, maxLength: 60 }
    Oferta:
      name: oferta
      in: query
      description: "`true` = solo productos con precio de oferta (incluye remates)"
      schema: { type: boolean }
    Temporada:
      name: temporada
      in: query
      schema: { $ref: "#/components/schemas/Temporada" }
    RecienLlegado:
      name: recien_llegado
      in: query
      description: "`true` = fecha_llegada dentro de los últimos `DIAS_RECIEN_LLEGADO` días (14 por defecto)"
      schema: { type: boolean }
    Orden:
      name: orden
      in: query
      schema:
        type: string
        enum: [relevancia, precio_asc, precio_desc, recientes]
        default: relevancia
      description: "`relevancia`: con stock primero, luego los más nuevos. Precios ordenan por `precio_final`."

    Canal:
      name: canal
      in: query
      schema: { $ref: "#/components/schemas/Canal" }
    BusquedaPedido:
      name: q
      in: query
      description: |
        Número (`DC-0012`), nombre o teléfono. Si son solo dígitos (con espacios, `+` o `-`), busca en el teléfono;
        si no, palabra por palabra en número y nombre (sin tildes ni mayúsculas). Máximo 60 caracteres.
      schema: { type: string, maxLength: 60 }
    Desde:
      name: desde
      in: query
      description: Día de Chile, inclusive (filtra por creado_en)
      schema: { type: string, format: date }
    Hasta:
      name: hasta
      in: query
      description: Día de Chile, inclusive
      schema: { type: string, format: date }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Validacion:
      description: "`validacion`: `campos` trae el motivo por campo"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error:
              codigo: validacion
              mensaje: Revisa los datos del pedido.
              campos:
                telefono: usa un número chileno, por ejemplo +56 9 1234 5678
                items[0].cantidad: debe estar entre 1 y 500
    NoAutenticado:
      description: "`no_autenticado`: sin sesión, sesión vencida (12 h) o inactiva (2 h)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Limite:
      description: "`demasiadas_solicitudes` o `login_bloqueado`"
      headers:
        Retry-After:
          description: Segundos a esperar
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              enum:
                - validacion
                - json_invalido
                - tipo_no_soportado
                - cuerpo_muy_grande
                - origen_no_permitido
                - no_autenticado
                - credenciales_invalidas
                - login_bloqueado
                - admin_no_configurado
                - no_encontrado
                - sin_permiso
                - no_editable
                - stock_insuficiente
                - no_permitido_sobre_si_mismo
                - imagen_invalida
                - transicion_invalida
                - duplicado
                - conflicto
                - demasiadas_solicitudes
                - no_disponible
                - interno
            mensaje: { type: string, description: Texto en español apto para mostrar al usuario }
            campos:
              type: object
              additionalProperties: { type: string }
            detalles: {}

    Pagina:
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    Opcion:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: { type: string, examples: [nuble, starken] }
        nombre: { type: string, examples: ["Ñuble", "Starken"] }

    Categoria:
      type: object
      required: [id, slug, nombre, total_productos]
      properties:
        id: { type: integer }
        slug: { type: string, examples: [navidad] }
        nombre: { type: string, examples: [Navidad] }
        total_productos: { type: integer, description: Productos activos de la categoría }

    Temporada:
      type: string
      enum: [navidad, escolar, fiestas_patrias, halloween, invierno, verano]

    Badge:
      type: string
      enum: [oferta, remate, recien_llegado, temporada]
      description: |
        `oferta`/`remate`: tiene precio_oferta (según etiqueta_oferta). `recien_llegado`: fecha_llegada
        en los últimos 14 días. `temporada`: tiene temporada (ver campo `temporada`).

    Disponibilidad:
      type: string
      enum: [disponible, quedan_pocos, agotado]
      description: |
        Calculada del stock interno: 0 → agotado; ≤ umbral (5) → quedan_pocos; si no, disponible.
        En el demo el stock es `[EJEMPLO]`.

    ProductoPublico:
      type: object
      required: [id, slug, codigo, nombre, descripcion, categoria, precio, precio_final, disponibilidad, badges, es_ejemplo]
      properties:
        id: { type: integer }
        slug: { type: string, examples: [squishy-viral-que-cambia-de-color-con-el-sol] }
        codigo: { type: string, examples: [P001], description: Código interno; va en el mensaje de WhatsApp }
        nombre: { type: string }
        descripcion:
          type: string
          description: Puede contener `[EJEMPLO]` en lo que no tiene fuente; el front debe mostrarlo visible.
        categoria:
          type: object
          properties:
            id: { type: integer }
            slug: { type: string }
            nombre: { type: string }
        precio: { type: integer, description: Precio normal al detalle (CLP) }
        precio_oferta:
          type: [integer, "null"]
          description: "Menor que precio. En la API pública va en null si la oferta venció (ver oferta_hasta)"
        precio_final: { type: integer, description: "Lo que se cobra hoy por 1 unidad: la oferta si está vigente; si no, precio" }
        etiqueta_oferta: { type: [string, "null"], enum: [oferta, remate, null], description: "null si no hay oferta vigente" }
        oferta_hasta:
          type: [string, "null"]
          format: date
          description: "Último día (hora de Chile) en que vale la oferta; null = sin vencimiento. Ej.: tren navideño grande 2026-11-15, según su video"
        oferta_vigente: { type: boolean, description: "true si precio_oferta se aplica hoy" }
        precio_actualizado_en:
          type: [string, "null"]
          format: date-time
          description: "UTC. Último cambio de precio hecho en el panel; null = precio tal como salió de la fuente (ver fuente.fecha)"
        precio_mayor: { type: [integer, "null"], description: "Precio POR UNIDAD al comprar desde mayor_minimo unidades" }
        mayor_minimo: { type: [integer, "null"], minimum: 2 }
        mayor_minimo_confirmado:
          type: boolean
          description: "true si el mínimo por mayor salió de la fuente (video); false = mínimo [EJEMPLO] o sin precio por mayor"
        unidad_mayor:
          type: [string, "null"]
          description: Texto para mostrar junto al precio por mayor
          examples: ["caja de 12", "embalaje de 16 (surtido)", "desde 10 u.", "docena surtida ($6.000)"]
        disponibilidad: { $ref: "#/components/schemas/Disponibilidad" }
        badges:
          type: array
          items: { $ref: "#/components/schemas/Badge" }
        temporada: { oneOf: [{ $ref: "#/components/schemas/Temporada" }, { type: "null" }] }
        fecha_llegada: { type: [string, "null"], format: date, description: "(inferencia) en el demo = fecha del video" }
        imagen_url:
          type: [string, "null"]
          description: "Ruta del front (`/productos/tt-<videoId>.webp`), imagen subida (`/api/imagenes/<archivo>`) o URL https"
        tiktok_url: { type: [string, "null"], description: "Video de TikTok donde aparece (link, sin embeber con autoplay)" }
        fuente:
          description: De dónde sale el precio. Si la fecha es antigua, mostrar "precio visto el …; reconfirmar".
          oneOf:
            - type: "null"
            - type: object
              properties:
                url: { type: string }
                fecha: { type: [string, "null"], format: date }
        es_ejemplo: { type: boolean, description: "true = producto o precio sin fuente real ([EJEMPLO])" }

    ProductoAdmin:
      allOf:
        - $ref: "#/components/schemas/ProductoPublico"
        - type: object
          required: [stock, umbral_pocos, activo, creado_en, actualizado_en]
          description: "En el admin, precio_oferta y etiqueta_oferta muestran lo guardado aunque la oferta haya vencido"
          properties:
            stock: { type: integer }
            umbral_pocos: { type: integer }
            activo: { type: boolean }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }

    ProductoEntrada:
      type: object
      description: |
        precio_actualizado_en no se envía: el servidor lo fija al crear y al cambiar precio, precio_oferta o
        precio_mayor. La imagen se cambia con POST /api/admin/productos/{id}/imagen.
      additionalProperties: false
      required: [codigo, nombre, categoria_id, precio, stock]
      properties:
        slug: { type: string, maxLength: 80, description: "Si va vacío se genera desde el nombre" }
        codigo: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9-]{1,19}$", description: Se guarda en mayúsculas }
        nombre: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, maxLength: 2000 }
        categoria_id: { type: integer }
        precio: { type: integer, minimum: 1, maximum: 10000000 }
        precio_oferta: { type: [integer, "null"], description: "< precio" }
        etiqueta_oferta: { type: string, enum: [oferta, remate], default: oferta }
        precio_mayor: { type: [integer, "null"], description: "Por unidad, < precio. Va junto con mayor_minimo" }
        mayor_minimo: { type: [integer, "null"], minimum: 2, maximum: 10000 }
        mayor_minimo_confirmado: { type: boolean, default: false, description: "Solo cuenta si hay precio_mayor" }
        unidad_mayor: { type: string, maxLength: 60 }
        oferta_hasta: { type: [string, "null"], format: date, description: "Solo junto con precio_oferta" }
        stock: { type: integer, minimum: 0, maximum: 1000000 }
        umbral_pocos: { type: integer, minimum: 0, maximum: 1000, default: 5 }
        activo: { type: boolean, default: true }
        temporada: { oneOf: [{ $ref: "#/components/schemas/Temporada" }, { type: "null" }] }
        fecha_llegada: { type: [string, "null"], format: date }
        imagen_url: { type: [string, "null"], maxLength: 500 }
        tiktok_url: { type: [string, "null"], description: "https://(www|vm|m.)tiktok.com/…" }
        fuente_url: { type: [string, "null"], description: https }
        fuente_fecha: { type: [string, "null"], format: date }
        es_ejemplo: { type: boolean, default: false }

    ConfigPublica:
      type: object
      required: [nombre_tienda, whatsapp_santiago, whatsapp_regiones, whatsapp_regiones_confirmado, direccion, horario, horario_confirmado, site_url]
      properties:
        nombre_tienda: { type: string, examples: ["Donde Carlitos Emporio"] }
        whatsapp_santiago: { type: string, description: "Formato wa.me (solo dígitos)", examples: ["56921145368"] }
        whatsapp_regiones: { type: [string, "null"], description: "null = no confirmado; usar el de Santiago y mostrar [CONFIRMAR]" }
        whatsapp_regiones_confirmado: { type: boolean }
        direccion: { type: string, examples: ["Alameda 2432, Santiago Centro"] }
        horario: { type: string, examples: ["Lunes a viernes 09:00–17:00 · Sábado 09:00–15:00"] }
        horario_confirmado: { type: boolean, description: "false = mostrar como 'por confirmar'" }
        site_url: { type: string, examples: ["http://localhost:3100"] }

    Canal:
      type: string
      enum: [santiago, regiones]
      description: "WhatsApp por el que llegó el pedido: Santiago/retiro o Regiones"

    EstadoPedido:
      type: string
      enum: [cotizado, esperando_pago, pagado, preparando, despachado, listo_retiro, entregado, cancelado]

    MedioPago:
      type: string
      enum: [transferencia, efectivo, debito, credito, otro]

    TipoPrecio:
      type: string
      enum: [detalle, oferta, mayor, libre]
      description: "libre = línea escrita a mano (no está en el catálogo)"

    FormaPago:
      type: string
      enum: [transferencia, en_tienda]
      description: "Cómo se acordó pagar. Por defecto: regiones → transferencia, santiago → en_tienda. Con envío, solo transferencia"

    ItemEntrada:
      type: object
      additionalProperties: false
      description: |
        Del catálogo: `producto_id` + `cantidad`. Libre: `descripcion` + `cantidad` (+ `precio_unitario` opcional;
        sin precio, la línea sale sin precio en la cotización). No se pueden mezclar (`producto_id` con
        `descripcion`/`precio_unitario`).
      required: [cantidad]
      properties:
        producto_id: { type: integer, minimum: 1 }
        descripcion: { type: string, minLength: 2, maxLength: 120 }
        cantidad: { type: integer, minimum: 1, maximum: 10000 }
        precio_unitario: { type: integer, minimum: 0, maximum: 10000000 }

    PedidoEntrada:
      type: object
      additionalProperties: false
      required: [canal, telefono, items]
      properties:
        canal: { $ref: "#/components/schemas/Canal" }
        nombre: { type: string, maxLength: 80, description: "Opcional. Letras, espacios, ' . -. Los mensajes usan el primer nombre" }
        telefono: { type: string, description: "Chileno; se guarda como +569XXXXXXXX. En logs va enmascarado" }
        entrega: { type: string, enum: [retiro, envio], description: "Por defecto según canal (santiago → retiro, regiones → envio)" }
        region: { type: string, description: "Código de /api/opciones-entrega. Opcional" }
        comuna: { type: string, maxLength: 60, description: "Opcional al registrar; obligatoria para despachar" }
        agencia: { type: string, description: "Código de /api/opciones-entrega. Opcional al registrar; obligatoria para despachar" }
        forma_pago: { $ref: "#/components/schemas/FormaPago" }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ItemEntrada" }
        descuento: { type: integer, minimum: 0, default: 0 }
        costo_envio: { type: integer, minimum: 0, default: 0, description: "Solo con envío; se suma al total" }
        envio_por_pagar: { type: boolean, default: false, description: "Envío por pagar en la agencia (solo con envío y sin costo_envio)" }
        total: { type: integer, minimum: 0, description: "Obligatorio si alguna línea va sin precio; si todas tienen precio, debe coincidir con el cálculo" }
        nota_interna: { type: string, maxLength: 1000, description: "Solo para el equipo; nunca sale al cliente" }
        estado_inicial: { type: string, enum: [cotizado, esperando_pago], default: cotizado, description: "Solo en POST" }

    ItemPedido:
      type: object
      required: [producto_id, codigo, descripcion, cantidad, precio_unitario, tipo_precio, subtotal]
      properties:
        producto_id: { type: [integer, "null"], description: "null = línea libre" }
        codigo: { type: [string, "null"] }
        descripcion: { type: string, description: "Nombre del producto congelado, o el texto de la línea libre" }
        cantidad: { type: integer }
        precio_unitario: { type: [integer, "null"], description: "Congelado al registrar o editar; null = línea libre sin precio" }
        tipo_precio: { $ref: "#/components/schemas/TipoPrecio" }
        subtotal: { type: [integer, "null"] }

    UsuarioRef:
      type: [object, "null"]
      properties:
        id: { type: integer }
        nombre: { type: string }

    Pago:
      type: [object, "null"]
      properties:
        medio: { $ref: "#/components/schemas/MedioPago" }
        monto: { type: integer }
        fecha: { type: string, format: date }
        verificado_por: { $ref: "#/components/schemas/UsuarioRef" }

    CambioEstado:
      type: object
      properties:
        estado_anterior: { oneOf: [{ $ref: "#/components/schemas/EstadoPedido" }, { type: "null" }] }
        estado_nuevo: { $ref: "#/components/schemas/EstadoPedido" }
        usuario: { $ref: "#/components/schemas/UsuarioRef" }
        nota: { type: string }
        creado_en: { type: string, format: date-time }

    Pedido:
      type: object
      required: [id, numero, canal, estado, estado_desde, es_demo, nombre, telefono, entrega, forma_pago, items, subtotal, descuento, costo_envio, envio_por_pagar, total, total_manual, transiciones_permitidas, seguimiento_url, whatsapp_cliente_url, creado_en, actualizado_en]
      properties:
        id: { type: integer }
        numero: { type: string, examples: [DC-0007] }
        canal: { $ref: "#/components/schemas/Canal" }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        estado_desde: { type: string, format: date-time, description: "Desde cuándo está en el estado actual" }
        es_demo: { type: boolean, description: "Pedido ficticio de la semilla" }
        nombre: { type: string, description: "Puede ser vacío" }
        telefono: { type: string, examples: ["+56900000101"] }
        entrega: { type: string, enum: [retiro, envio] }
        region: { type: [string, "null"] }
        region_nombre: { type: [string, "null"] }
        comuna: { type: [string, "null"] }
        agencia: { type: [string, "null"] }
        agencia_nombre: { type: [string, "null"] }
        n_seguimiento: { type: [string, "null"] }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemPedido" }
        forma_pago: { $ref: "#/components/schemas/FormaPago" }
        subtotal: { type: integer, description: "Suma de las líneas con precio" }
        descuento: { type: integer }
        costo_envio: { type: integer }
        envio_por_pagar: { type: boolean }
        total: { type: integer }
        total_manual: { type: boolean, description: "true = hay líneas sin precio y el total lo escribió quien atiende" }
        motivo_cancelacion: { type: string }
        nota_interna: { type: string }
        pago: { $ref: "#/components/schemas/Pago" }
        stock_descontado: { type: boolean }
        registrado_por: { $ref: "#/components/schemas/UsuarioRef" }
        seguimiento_url: { type: string, examples: ["http://localhost:3100/seguimiento/0f1e…"] }
        transiciones_permitidas:
          type: array
          items: { $ref: "#/components/schemas/EstadoPedido" }
        whatsapp_cliente_url: { type: string, description: "https://wa.me/<teléfono sin +>; en pedidos es_demo, https://wa.me/ (sin número)" }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
        historial:
          type: array
          description: Solo en detalle, POST, PUT y PATCH
          items: { $ref: "#/components/schemas/CambioEstado" }

    CambioEstadoEntrada:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        nota: { type: string, maxLength: 200 }
        pago:
          type: object
          additionalProperties: false
          description: Obligatorio para pasar a pagado (y para entregado si pagó al retirar)
          required: [medio, monto]
          properties:
            medio: { $ref: "#/components/schemas/MedioPago" }
            monto: { type: integer, minimum: 1, maximum: 100000000 }
            fecha: { type: string, format: date, description: "Por defecto, hoy (Chile)" }
        confirmo_pago_recibido: { type: boolean, description: "Obligatorio (true) para pasar a pagado" }
        agencia: { type: string, description: "Para despachado; reemplaza la del pedido" }
        n_seguimiento: { type: string, maxLength: 60, description: "Obligatorio para despachado" }
        comuna: { type: string, maxLength: 60, description: "Para despachado si el pedido no la tiene; reemplaza la del pedido" }
        motivo: { type: string, maxLength: 200, description: "Solo al cancelar; sale en el mensaje d6" }

    Seguimiento:
      type: object
      required: [numero, estado, entrega, agencia_nombre, n_seguimiento, linea_tiempo]
      properties:
        numero: { type: string }
        estado: { $ref: "#/components/schemas/EstadoPedido" }
        entrega: { type: string, enum: [retiro, envio] }
        agencia_nombre: { type: [string, "null"] }
        n_seguimiento: { type: [string, "null"] }
        linea_tiempo:
          type: array
          items:
            type: object
            properties:
              estado: { $ref: "#/components/schemas/EstadoPedido" }
              fecha: { type: string, format: date-time }

    MensajeCliente:
      type: object
      required: [clave, titulo, texto, whatsapp_url, sugerido]
      properties:
        clave: { type: string, enum: [cotizacion, datos_transferencia, recordatorio_pago, pago_recibido, despachado, listo_retiro, cancelado, abrir_chat] }
        titulo: { type: string, examples: ["Enviar cotización"] }
        texto: { type: string, description: "Texto exacto (LF, sin salto final)" }
        whatsapp_url: { type: string }
        sugerido: { type: boolean, description: "El que corresponde al estado actual" }

    Hoy:
      type: object
      required: [fecha, contadores, esperando_pago_mas_24h, pagados_sin_despachar, listos_retiro, creados_hoy]
      properties:
        fecha: { type: string, format: date, description: "Hoy en Chile" }
        contadores:
          type: object
          properties:
            esperando_pago_mas_24h: { type: integer }
            pagados_sin_despachar: { type: integer }
            listos_retiro: { type: integer }
            creados_hoy_santiago: { type: integer }
            creados_hoy_regiones: { type: integer }
        esperando_pago_mas_24h: { type: array, items: { $ref: "#/components/schemas/Pedido" } }
        pagados_sin_despachar: { type: array, items: { $ref: "#/components/schemas/Pedido" } }
        listos_retiro: { type: array, items: { $ref: "#/components/schemas/Pedido" } }
        creados_hoy: { type: array, items: { $ref: "#/components/schemas/Pedido" } }

    Cliente:
      type: object
      required: [telefono, nombre, total_pedidos, total_comprado, pedidos]
      properties:
        telefono: { type: string }
        nombre: { type: [string, "null"], description: "El del pedido más reciente" }
        total_pedidos: { type: integer }
        total_comprado: { type: integer, description: "Suma de totales de pedidos no cancelados" }
        pedidos: { type: array, items: { $ref: "#/components/schemas/Pedido" } }

    FilaResumen:
      type: object
      properties:
        clave: { type: [string, "null"], description: "canal, estado o código de agencia" }
        nombre: { type: [string, "null"], description: "Nombre visible (agencia)" }
        pedidos: { type: integer }
        monto: { type: integer }

    Resumen:
      type: object
      properties:
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        totales:
          type: object
          properties:
            pedidos: { type: integer }
            monto: { type: integer }
            cancelados: { type: integer }
        por_canal: { type: array, items: { $ref: "#/components/schemas/FilaResumen" } }
        por_estado: { type: array, items: { $ref: "#/components/schemas/FilaResumen" } }
        por_agencia: { type: array, items: { $ref: "#/components/schemas/FilaResumen" } }

    Usuario:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombre: { type: string }
        rol: { type: string, enum: [admin, vendedor] }
        activo: { type: boolean }
        creado_en: { type: string, format: date-time }

    UsuarioConClave:
      type: object
      properties:
        usuario: { $ref: "#/components/schemas/Usuario" }
        clave_temporal: { type: string, description: "Se muestra UNA sola vez; no se guarda en claro" }

    Sesion:
      type: object
      properties:
        id: { type: integer }
        usuario: { type: string }
        nombre: { type: string }
        rol: { type: string, enum: [admin, vendedor] }
        expira_en: { type: string, format: date-time }
